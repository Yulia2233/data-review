<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD Code 轨迹标注</title><script>if(location.protocol==='file:'){location.replace('http://127.0.0.1:8778/');}</script><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-dot"></span><strong>CAD Code 轨迹标注</strong><span class="version" id="catalogCount">轨迹审核</span></div><div class="progress"><span id="progressText">载入中</span><div class="progress-track"><i id="progressBar"></i></div></div><span id="saveState" role="status">标注自动保存</span></header>
<nav class="toolbar" aria-label="零件导航"><select id="scope" aria-label="数据范围"><option value="all">全部轨迹</option><option value="datav1v63">datav1 565 重跑 · v6.3</option><option value="rerun934">934 重跑 · v6.3</option><option value="datav1">datav1 含思考</option></select><select id="filter" aria-label="标注状态"><option value="all">全部状态</option><option value="unmarked">未标注</option><option value="pass">✅</option><option value="fail">❌</option></select><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索零件名称" aria-label="搜索零件名称"></div><div class="navigation"><button id="prev" class="icon-button" aria-label="上一个零件">←</button><span id="position">—</span><button id="next" class="icon-button" aria-label="下一个零件">→</button></div></nav>
<div id="errorBanner" role="alert" hidden></div>
<main id="workspace">
<section class="trajectory-column" aria-label="轨迹和标注"><div class="section-header"><div><span class="eyebrow">TRAJECTORY</span><h1 id="caseTitle">载入轨迹</h1></div><a id="rawLink" class="quiet-link" download>原始 JSON ↗</a></div><div id="caseMeta" class="case-meta"></div><div id="trajectoryScroll"><div id="messages"></div><div id="empty" hidden><span class="empty-symbol">✓</span><h2>当前范围已全部标注</h2><p>可以切换范围，或查看已有标注。</p></div></div><footer class="mark-bar"><div><span id="currentMark">尚未标注</span><small>标注后自动跳到下一件</small></div><div class="mark-buttons"><button id="markFail" class="mark fail" aria-label="标为 ❌">❌</button><button id="markPass" class="mark pass" aria-label="标为 ✅">✅</button></div></footer></section>
<section class="comparison-column" aria-label="目标和重建等测图"><div class="section-header comparison-title"><div><span class="eyebrow">COMPARISON</span><h2>目标与重建</h2></div><span id="score" class="score"></span></div><div class="image-pair"><figure><figcaption><span><i class="image-dot target-dot"></i>Target</span><a id="targetDownload" title="下载目标 STEP">STEP ↓</a></figcaption><div class="image-frame"><img id="targetImage" alt="目标零件等测图" hidden><div class="image-placeholder" id="targetPlaceholder">等测图准备中</div></div></figure><figure><figcaption><span><i class="image-dot rebuild-dot"></i>Rebuild</span><a id="rebuildDownload" title="下载重建 STEP">STEP ↓</a></figcaption><div class="image-frame"><img id="rebuildImage" alt="重建零件等测图" hidden><div class="image-placeholder" id="rebuildPlaceholder">等测图准备中</div></div></figure></div><p class="comparison-hint"><span id="cameraHint">等测视角</span><span>点击图片放大</span></p><div id="intentCard" class="intent-card" hidden><h3>模型说明</h3><p id="designIntent"></p></div><details class="source-panel"><summary>重建代码 <a id="modelDownload" download>下载 .py ↗</a></summary><pre id="modelCode">展开后载入</pre></details></section>
</main>
<dialog id="imageDialog"><button id="closeImage" aria-label="关闭大图">×</button><img id="largeImage" alt="等测图大图"></dialog>
<script type="module" src="/app.js"></script></body></html>
